@if (studente(); as s) {
<h1 class="mb-4">Scheda dello studente</h1>
<app-studente-card [studente]="s" (rimosso)="rimuovi($event)" />
<div class="mt-3 d-flex flex-wrap gap-2">
  <a class="btn btn-outline-secondary" routerLink="/elenco">Torna all'elenco</a>
  <button type="button" class="btn btn-primary" (click)="successivo()">
    Studente successivo
  </button>
</div>
}
